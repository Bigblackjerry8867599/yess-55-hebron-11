<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius Hospitality Group | About Us - Hotels & Stays</title>
    <meta name="description" content="Discover the story behind Genius Hospitality Group and our mission to offer comfortable, welcoming hotels across Uganda.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3e362e;
            --secondary: #556b2f;
            --dark: #2d3436;
            --light: #000000;
            --accent: #ffd166;
            --text: #333333;
            --some: #ffffff;
            --hero-green: #4a7c3f;

            /* NEW: forest + gold gradient to match homepage */
            --hero-gradient: linear-gradient(135deg, #556b2f 0%, #2c3718 100%);

            --font-display: 'Marcellus', 'Playfair Display', Georgia, serif;
            --font-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: #ffffff;
            background-color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            background: #000;
            z-index: 1000;
            border-bottom: none;
            padding: 0;
            height: 38px;
            display: flex;
            align-items: center;
            font-family: var(--font-body);
            overflow: visible;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        #menu-toggle {
            display: none;
            margin-left: 0.5rem;
            margin-right: 0;
            font-size: 1.1rem;
            line-height: 1;
            padding: 2px 8px;
            min-width: 34px;
            min-height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #fff;
        }

        #nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 1.4rem;
            margin: 0;
            padding: 0;
        }

        #nav-links a {
            text-decoration: none;
            color: #fff;
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            line-height: 1;
            display: block;
        }

        #nav-links a:hover { color: var(--accent); }

        #nav-links .nav-cta {
            background-color: var(--accent);
            color: #3e362e;
            padding: 0.35rem 0.9rem;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        #nav-links.open {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: absolute;
            top: 38px;
            right: 1rem;
            left: auto;
            padding: 1rem;
            background: #000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            gap: 1rem;
            z-index: 999;
            text-align: left;
        }

        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            #nav-links   { display: none;  }
        }

        /* REST OF PAGE */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-family: var(--font-body);
            font-weight: 700;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 17px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #22300f;
        }
        .btn-primary:hover {
            background-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid #fff;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background-color: #fff;
            color: #22300f;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .hero-section {
            padding: 5rem 0;
            background: var(--hero-gradient);
            color: white;
            border-radius: 0 0 2rem 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1,
        .hero-section h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .hero p,
        .hero-section p {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 40px;
            color: #ffffff;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.65;
        }

        .hero-btns {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .our-story {
            padding: 60px 0 40px;
            background-color: #000;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .section-title h2 {
            font-size: 2.6rem;
            color: #ffffff;
            display: inline-block;
            padding-bottom: 15px;
            letter-spacing: 0.02em;
        }

        .section-title h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        .section-title p {
            font-size: 1.25rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 10px;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        .story-content {
            display: flex;
            align-items: center;
            gap: 50px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .story-text {
            flex: 1;
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.75;
            color: #ddd;
        }

        .story-text p { margin-bottom: 18px; }

        .story-image {
            flex: 1;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            margin: 0 auto 60px;
        }

        .story-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .milestones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 10px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px 60px;
        }

        .milestone-card {
            text-align: center;
            padding: 30px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .milestone-number {
            font-family: var(--font-body);
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--accent);
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .milestone-card h4 {
            font-size: 1.35rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .milestone-card p {
            font-size: 1.15rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.65;
        }

        .our-team {
            padding: 100px 0;
            background: var(--light);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .team-card {
            background-color: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }
        .team-card:hover { transform: translateY(-10px); }

        .team-image { height: 300px; overflow: hidden; }
        .team-image img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .team-card:hover .team-image img { transform: scale(1.05); }

        .team-info { padding: 25px; text-align: center; }
        .team-info h3 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
            color: var(--accent);
        }
        .team-info p {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .social-icons { display: flex; justify-content: center; gap: 15px; }
        .social-icons a { color: #fff; transition: color 0.3s ease; }
        .social-icons a:hover { color: var(--accent); }

        .our-values {
            padding: 100px 0;
            background-color: #f5efe6;
            color: #333;
        }

        .our-values .section-title h2 { color: #3e362e; }
        .our-values .section-title h2::after { background-color: #556b2f; }
        .our-values .section-title p { color: #55503f; }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .value-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #e6ddcb;
            transition: transform 0.3s ease;
        }
        .value-card:hover { transform: translateY(-10px); }

        .value-icon {
            font-size: 3rem;
            color: #556b2f;
            margin-bottom: 25px;
        }

        .value-card h3 {
            color: #3e362e;
            font-size: 1.45rem;
            margin-bottom: 15px;
            letter-spacing: 0.02em;
        }

        .value-card p {
            font-size: 1.25rem;
            font-weight: 600;
            color: #55503f;
            line-height: 1.7;
        }

        .testimonials { padding: 100px 0; background: #000000; }

        .testimonial-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 50px;
        }

        .testimonial-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(
